<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OpsPilot</title>

    <link
        rel="stylesheet"
        href="/ui/styles.css"
    >
</head>

<body>

    <main class="dashboard">

        <header>
            <div>
                <h1>OpsPilot</h1>
                <p>AI Customer Operations Agent</p>
            </div>

            <span class="system-status">
                ● System Online
            </span>
        </header>

        <section class="panel">
            <h2>Customer Request</h2>

            <textarea
                id="message"
                placeholder="Enter a customer request..."
            ></textarea>

            <button id="send-button">
                Send Request
            </button>
        </section>

        <section class="panel result-panel">
            <h2>Agent Result</h2>

            <div id="response" class="response-content">
                Waiting for request...
            </div>
        </section>

    </main>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitizes generated HTML before rendering -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <!-- OpsPilot frontend -->
    <script src="/ui/app.js"></script>

</body>

</html>
